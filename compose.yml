# Evolution API local, só leitura do WhatsApp pessoal. Segredos vêm do .env (chmod 600).
# Nada de mensagem é gravado no Postgres da Evolution: o webhook é o único caminho e filtra por lead.
name: mfl-evolution

services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.7@sha256:1bd8afc4a6cf48822e6cf02469aeae7bd35a12a6b616eacd1291926307f4d339
    restart: unless-stopped
    depends_on: [postgres]
    ports: ["127.0.0.1:8080:8080"]
    networks: [evo]
    volumes: [instancias:/evolution/instances]
    environment:
      SERVER_URL: http://127.0.0.1:8080
      AUTHENTICATION_API_KEY: ${MFL_EVOLUTION_KEY:?defina no .env}
      TELEMETRY_ENABLED: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${MFL_EVOLUTION_PG:?defina no .env}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: mfl_leads
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CONFIG_SESSION_PHONE_CLIENT: MFL Leads
      LOG_LEVEL: ERROR,WARN

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [evo]
    volumes: [pg:/var/lib/postgresql/data]
    environment:
      POSTGRES_USER: evolution
      POSTGRES_DB: evolution
      POSTGRES_PASSWORD: ${MFL_EVOLUTION_PG:?defina no .env}

networks:
  evo:
    # Nome fixo para a regra do UFW: sudo ufw allow in on mfl-evo to 172.31.250.1 port 8001 proto tcp
    driver_opts:
      com.docker.network.bridge.name: mfl-evo
    ipam:
      config:
        - subnet: 172.31.250.0/24
          gateway: 172.31.250.1  # o webhook (mfl webhook) escuta só neste IP

volumes:
  instancias:
  pg:

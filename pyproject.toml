[project]
name = "mfl-leads"
version = "0.1.0"
description = "Esteira local de leads do MyFoodLink"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.1",
    "flask>=3.1.3",
    "phonenumbers>=9.0.44",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "typer>=0.29.2",
]

[project.scripts]
mfl = "mfl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mfl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
